name: IonStack - S908E Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: 8Gen1 - android12-5.10

jobs:
  test-build:
    name: 8Gen1 - android12-5.10
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project:
          - S901BXXSNGZD7
          - S901EXXSEGZE3
          - S901U1UESAGZF3
          - S901U1UESAGZH3
          - S901USQSAGZF3
          - S901USQSAGZH3
          - S901USQU2BVK1
          - S901WVLS4DWL3
          - S901WVLSAGZH3
          - S9060ZCS9GZA1
          - S906EXXSEGZE3
          - S908BXXSMGZB2
          - S908BXXSNGZD7
          - S908EXXSEGZE3
          - S908EXXSEGZH4
          - S908NKSS9GZE5
          - S908WVLS8FYG7
          - S908WVLSAGZE3
          - SCG14KDS1EZE3
          - X900XXU9DYE5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          git rev-parse --short HEAD
          git status --short
          echo "Project: $PROJECT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            unzip \
            wget \
            file

      - name: Install Android NDK
        run: |
          mkdir -p "$HOME/android-ndk"
          cd "$HOME/android-ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "$HOME/android-ndk/android-ndk-r27c" >> "$GITHUB_PATH"

      - name: Verify toolchains
        run: |
          echo "=== GCC ARM ==="
          arm-linux-gnueabi-gcc --version
          echo "=== Clang ==="
          clang --version
          echo "=== NDK ==="
          "$ANDROID_NDK_HOME/ndk-build" --version || true

      - name: Build
        run: |
          make PROJECT="${{ matrix.project }}" clean preload root-helper

      - name: Publish build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-build
          path: build/${{ matrix.project }}/
          if-no-files-found: error
          retention-days: 14
