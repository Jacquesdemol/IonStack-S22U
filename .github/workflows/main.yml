name: IonStack - S908E Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: S908EXXSEGZE3

jobs:
  test-build:
    name: Validate S908EXXSEGZE3
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          git rev-parse --short HEAD
          git status --short
          echo "Project: $PROJECT"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            unzip \
            wget \
            file

      - name: Install Android NDK
        run: |
          mkdir -p "$HOME/android-ndk"
          cd "$HOME/android-ndk"

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip

          unzip -q android-ndk-r27c-linux.zip

          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r27c" \
            >> "$GITHUB_ENV"

          echo "$HOME/android-ndk/android-ndk-r27c" \
            >> "$GITHUB_PATH"

      - name: Verify toolchains
        run: |
          echo "=== GCC ARM ==="
          arm-linux-gnueabi-gcc --version

          echo "=== Clang ==="
          clang --version

          echo "=== NDK ==="
          "$ANDROID_NDK_HOME/ndk-build" --version || true

      - name: Verify S908E target
        run: |
          test -f "src/targets/$PROJECT/target.h"

          echo "Target found:"
          ls -lh "src/targets/$PROJECT/target.h"

      - name: Compilar
        run: |
          make PROJECT=S908EXXSEGZE3 clean preload root-helper

      - name: Mostrar arquivos gerados
        run: |
          find build -type f -maxdepth 5 -print

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: S908E-build
          path: build/S908EXXSEGZE3/
